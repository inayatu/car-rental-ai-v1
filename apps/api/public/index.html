<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden | GB Trails API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #05070f;
      font-family: "Outfit", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #e7ecff;
    }
    .forbidden {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      isolation: isolate;
      background:
        radial-gradient(circle at 10% 15%, rgba(67, 56, 202, 0.55), transparent 42%),
        radial-gradient(circle at 90% 15%, rgba(220, 38, 38, 0.45), transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.3), transparent 48%),
        #05070f;
    }
    .forbidden::before,
    .forbidden::after {
      content: "";
      position: absolute;
      inset: -20%;
      z-index: -1;
      filter: blur(44px);
      opacity: 0.6;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .forbidden::before {
      background: conic-gradient(from 0deg, rgba(99, 102, 241, 0.6), rgba(244, 63, 94, 0.55), rgba(6, 182, 212, 0.55), rgba(99, 102, 241, 0.6));
    }
    .forbidden::after {
      animation-duration: 18s;
      animation-direction: alternate-reverse;
      background: conic-gradient(from 180deg, rgba(2, 132, 199, 0.45), rgba(168, 85, 247, 0.5), rgba(248, 113, 113, 0.45), rgba(2, 132, 199, 0.45));
    }
    .card {
      width: min(92vw, 720px);
      border-radius: 24px;
      padding: clamp(1.2rem, 4vw, 2.2rem);
      text-align: center;
      background: linear-gradient(155deg, rgba(12, 17, 34, 0.92), rgba(20, 21, 40, 0.78));
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 24px 75px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
    }
    .lock {
      font-size: clamp(2.6rem, 8vw, 4rem);
      line-height: 1;
      display: inline-block;
      margin-bottom: 0.4rem;
      animation: pulse 2.4s ease-in-out infinite;
    }
    .code {
      margin: 0;
      color: #fda4af;
      font-weight: 700;
      letter-spacing: 0.09em;
      font-size: clamp(0.75rem, 2.6vw, 0.9rem);
      text-transform: uppercase;
    }
    h1 {
      margin: 0.55rem 0 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2rem, 9vw, 4.2rem);
      line-height: 0.95;
      letter-spacing: 0.01em;
      color: #ffffff;
    }
    p {
      margin: 0.85rem auto 0;
      max-width: 52ch;
      color: rgba(224, 231, 255, 0.86);
      font-size: clamp(0.9rem, 3.4vw, 1.05rem);
      line-height: 1.6;
    }
    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 1.25rem;
    }
    .btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.6rem;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(250, 204, 21, 0.28);
      color: #fde68a;
      font-weight: 600;
      font-size: 0.92rem;
      background: rgba(250, 204, 21, 0.08);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn.secondary {
      color: #c7d2fe;
      border-color: rgba(199, 210, 254, 0.26);
      background: rgba(199, 210, 254, 0.08);
    }
    .btn:hover {
      transform: translateY(-1px);
      background: rgba(250, 204, 21, 0.16);
    }
    .btn.secondary:hover {
      background: rgba(199, 210, 254, 0.16);
    }
    .noise {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.085) 0.7px, transparent 0.7px);
      background-size: 3px 3px;
      opacity: 0.14;
      mix-blend-mode: soft-light;
      animation: grain 240ms steps(4) infinite;
    }
    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 1.5%, 0) scale(1.05); }
    }
    @keyframes pulse {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0)); }
      50% { transform: translateY(-2px) scale(1.06); filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.45)); }
    }
    @keyframes grain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(1px, -1px); }
      50% { transform: translate(-1px, 1px); }
      75% { transform: translate(1px, 1px); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
<body>
  <main class="forbidden" role="main" aria-live="polite">
    <section class="card" aria-label="Forbidden access">
      <div class="lock" aria-hidden="true">🔒</div>
      <p class="code">Error 403</p>
      <h1>Forbidden</h1>
      <p>
        This endpoint is reserved for authenticated API access. Direct browser access is blocked.
      </p>
      <div class="actions">
        <a class="btn" href="/api/docs">Open API Docs</a>
        <a class="btn secondary" href="/health">Check Health</a>
      </div>
    </section>
    <div class="noise" aria-hidden="true"></div>
  </main>
</body>
</html>
